version: 2
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    versioning-strategy: "increase-if-necessary"
    schedule:
      interval: "monthly"
    groups:
      python:
        patterns: ["*"]
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"

  # Frontend and its optional viewers
  - package-ecosystem: "npm"
    directories:
      - "/src/frontend/default"
      - "/src/frontend/default/viewers/*"
    schedule:
      interval: "monthly"
    groups:
      build:
        patterns: ["vite", "@vitejs/*"]
      lint:
        patterns: ["eslint", "@eslint/*", "eslint-plugin-*", "globals"]
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "github-actions"
